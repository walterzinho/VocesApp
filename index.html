<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ========================================================
         SECCIÓN 1: METADATOS Y TÍTULO
         ======================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voces Campesinas Radio</title>
    
    <!-- ========================================================
         SECCIÓN 2: ICONOS Y FAVICON
         ======================================================== -->
    <link rel="icon" type="image/png" href="LogoVC.png">
    <link rel="shortcut icon" href="LogoVC.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="android-icon-192x192.png">
    
    <!-- ========================================================
         SECCIÓN 3: CONFIGURACIÓN PWA
         ======================================================== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17202A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- ========================================================
         SECCIÓN 4: LIBRERÍAS EXTERNAS
         ======================================================== -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* ========================================================
           SECCIÓN 5: ESTILOS PERSONALIZADOS (CSS)
           ======================================================== */
        :root {
            --carbon: #17202A;
            --trigo: #F4D03F;
            --rojo-alerta: #C0392B;
        }

        .volume-slider::-webkit-slider-thumb { 
            appearance: none; 
            width: 18px; 
            height: 18px; 
            background: var(--trigo); 
            border-radius: 50%; 
            cursor: pointer; 
            border: 2px solid white; 
        }
        
        body { 
            background: var(--carbon); 
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            overscroll-behavior-y: none;
            overflow: hidden; 
            height: 100%;
            width: 100%;
        }

        @keyframes speaker-beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .animate-speaker { animation: speaker-beat 2s infinite ease-in-out; }

        @keyframes loading-bar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
        .animate-loading { animation: loading-bar 2s infinite linear; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
        }

        .active-tab {
            color: var(--trigo) !important;
            background: rgba(244, 208, 63, 0.1);
        }

        .live-card {
            position: relative;
            width: 100%;
            height: 120px;
            border-radius: 0;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
        }
        .live-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 14, 19, 0.95) 5%, rgba(10, 14, 19, 0.2) 100%);
        }

        .next-band {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(244, 208, 63, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-install { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // COMPONENTE: ICON (SVGS INTERNOS PARA MÁXIMA ESTABILIDAD)
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                'radio': <path d="M4.9 19.1a1 1 0 0 0 1.4 0l1.6-1.6a1 1 0 0 0 0-1.4 7 7 0 1 1 8.2 0 1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0 11 11 0 1 0-14.2 0ZM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>,
                'calendar': <g><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></g>,
                'newspaper': <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>,
                'share-2': <g><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></g>,
                'play': <polygon points="5 3 19 12 5 21 5 3"></polygon>,
                'pause': <g><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></g>,
                'square': <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>,
                'volume-2': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></g>,
                'volume-x': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></g>,
                'download-cloud': <g><path d="M4 14.89c0-4 3.12-7.39 7.06-7.39 1.1 0 2.12.25 3.03.7a6 6 0 0 1 8.91 5.3c0 .54-.08 1.05-.22 1.54"></path><path d="M12 12v9"></path><path d="m15 18-3 3-3-3"></path></g>,
                'facebook': <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>,
                'instagram': <g><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></g>,
                'youtube': <g><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></g>,
                'tiktok': <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>,
                'globe': <g><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></g>,
                'chevron-right': <polyline points="9 18 15 12 9 6"></polyline>,
                'message-circle': <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"></path>,
                'mail': <g><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path><rect x="2" y="5" width="20" height="14" rx="2"></rect></g>,
                'message-square': <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>,
                'clock': <g><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></g>
            };

            return (
                <svg 
                    viewBox="0 0 24 24" 
                    width={size} 
                    height={size} 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name] || <circle cx="12" cy="12" r="10" strokeDasharray="4" />}
                </svg>
            );
        };

        const RADIO_CONFIG = {
            name: "Voces Campesinas",
            streamUrl: "https://a1.asurahosting.com/listen/voces_campesinas/radio.mp3",
            logoPath: "LogoVC.png", 
            whatsapp: "573224626138",
            displayWhatsapp: "322.462.6138",
            youtubeUrl: "https://www.youtube.com/@VocesCampesinasCo",
            webUrl: "https://www.vocescampesinas.co",
            email: "emisora@vocescampesinas.co",
            bloggerFeed: "https://vocescampesinas.blogspot.com/feeds/posts/default?alt=json&max-results=12"
        };

        const SCHEDULE = [
            { start: "00:00", end: "04:59", title: "La Licuadora", host: "Franja Crossover", org: "Voces Campesinas", category: "franja", days: [1,2,3,4,5,6,0], image: "la-licuadora.jpg" },
            { start: "05:00", end: "06:29", title: "Alborada Campesina", host: "Música Colombiana", org: "Producción Local", category: "franja", days: [1,2,3,4,5,6,0], image: "alborada.jpg" },
            { start: "06:15", end: "06:27", title: "Voces del Cosmos", host: "Horoscopo Semanal", org: "Voces Campesinas", category: "propio", days: [6, 1], image: "campesinos-accion.jpg" },
            { start: "06:30", end: "06:59", title: "Campesinos en Acción", host: "Equipo Comunicaciones", org: "ANUC La Palma", category: "entidad", days: [6, 1], image: "campesinos-accion.jpg" },
            { start: "07:00", end: "07:59", title: "Perreo Campesino", host: "Música Carranguera", org: "Voces Campesinas", category: "franja", days: [1,2,4,5,0], image: "perreo-campesino.jpg" },
            { start: "07:30", end: "10:59", title: "Magazín Región Activa", host: "Jotta Ricón", org: "CorpoActúa", category: "entidad", days: [6, 3], image: "region-activa.jpg" },
            { start: "13:00", end: "13:59", title: "Perreo Campesino", host: "Música Carranguera", org: "Voces Campesinas", category: "franja", days: [1,2,3,4,5,6,0], image: "perreo-tarde.jpg" },
            { start: "19:30", end: "20:30", title: "Renacer Andino", host: "Ramón Olivares", org: "Grupo Cultural", category: "entidad", days: [0, 3], image: "renacer-andino.jpg" },
            { start: "19:30", end: "22:59", title: "Lo Mejor de Región Activa", host: "Jotta Rincón", org: "CorpoActúa", category: "reemision", days: [5], image: "resumen-region.jpg" },
            
            // PROGRAMAS PRÓXIMAMENTE (Ejemplos)
            { start: "--:--", end: "--:--", title: "La Parcela Política", host: "Gran Lanzamiento", org: "Voces Campesinas", category: "pronto", days: [] },
            { start: "--:--", end: "--:--", title: "Sembrando Esperanza", host: "Gran Lanzamiento", org: "Voces Campesinas", category: "pronto", days: [] },
            { start: "--:--", end: "--:--", title: "Palabras del Territorio", host: "Gran Lanzamiento", org: "Voces Campesinas", category: "pronto", days: [] }
        ];

        const DAYS_SHORT = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        const DAYS_FULL = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

        const App = () => {
            const [isSplash, setIsSplash] = useState(true);
            const [isPlaying, setIsPlaying] = useState(false);
            const [volume, setVolume] = useState(0.8);
            const [currentView, setCurrentView] = useState('home');
            const [currentProgram, setCurrentProgram] = useState(null);
            const [nextProgram, setNextProgram] = useState(null);
            const [nextDayInfo, setNextDayInfo] = useState("");
            const [news, setNews] = useState([]);
            const [loadingNews, setLoadingNews] = useState(false);
            const [formType, setFormType] = useState('mensaje'); 
            const [requestData, setRequestData] = useState({ nombre: '', cancion: '', interprete: '', mensaje: '' });
            const [showInstallBtn, setShowInstallBtn] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const audioRef = useRef(null);

            useEffect(() => {
                const splashTimer = setTimeout(() => setIsSplash(false), 4500);

                if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
                    navigator.serviceWorker.register('./sw.js').then(reg => {
                        reg.onupdatefound = () => {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = () => {
                                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    window.location.reload();
                                }
                            };
                        };
                    }).catch(e => console.warn('SW:', e.message));
                }

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                });

                const updateTimeLogic = () => {
                    const now = new Date();
                    const cur = now.getHours() * 60 + now.getMinutes();
                    const day = now.getDay();
                    const timeToMin = (t) => { const [h,m] = t.split(':').map(Number); return h*60+m; };
                    
                    const prog = SCHEDULE.find(p => p.category !== 'pronto' && cur >= timeToMin(p.start) && cur < timeToMin(p.end) && (p.days ? p.days.includes(day) : true));
                    setCurrentProgram(prog || null);

                    let upcoming = null;
                    let label = "Hoy";
                    upcoming = SCHEDULE.filter(p => p.category !== 'pronto' && p.days.includes(day)).filter(p => timeToMin(p.start) > cur).sort((a,b) => timeToMin(a.start) - timeToMin(b.start))[0];

                    if (!upcoming) {
                        for (let i = 1; i <= 7; i++) {
                            const checkDay = (day + i) % 7;
                            const found = SCHEDULE.filter(p => p.category !== 'pronto' && p.days.includes(checkDay)).sort((a,b) => timeToMin(a.start) - timeToMin(b.start))[0];
                            if (found) {
                                upcoming = found;
                                label = i === 1 ? "Mañana" : DAYS_FULL[checkDay];
                                break;
                            }
                        }
                    }
                    setNextProgram(upcoming || null);
                    setNextDayInfo(label);
                };

                updateTimeLogic();
                const interval = setInterval(updateTimeLogic, 30000);
                return () => { clearInterval(interval); clearTimeout(splashTimer); };
            }, []);

            const fetchNews = async () => {
                setLoadingNews(true);
                const target = RADIO_CONFIG.bloggerFeed;
                const proxies = [
                    `https://api.allorigins.win/get?url=${encodeURIComponent(target + '&t=' + Date.now())}`,
                    `https://corsproxy.io/?${encodeURIComponent(target)}`
                ];

                const processData = (json) => {
                    try {
                        const entries = json.feed?.entry || [];
                        const formatted = entries.map(e => {
                            const link = e.link.find(l => l.rel === 'alternate')?.href || RADIO_CONFIG.webUrl;
                            let img = "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=400";
                            if (e.media$thumbnail) img = e.media$thumbnail.url.replace('/s72-c/', '/s640/');
                            return {
                                title: e.title.$t,
                                link: link,
                                date: new Date(e.published.$t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }),
                                thumbnail: img,
                                summary: e.summary?.$t ? e.summary.$t.replace(/<[^>]*>?/gm, '').substring(0, 110).trim() + '...' : 'Toca para leer más.'
                            };
                        });
                        setNews(formatted);
                        setLoadingNews(false);
                    } catch (err) { setLoadingNews(false); }
                };

                for (const url of proxies) {
                    try {
                        const res = await fetch(url);
                        const raw = await res.json();
                        const data = (typeof raw.contents === 'string') ? JSON.parse(raw.contents) : raw;
                        if (data && data.feed) {
                            processData(data);
                            return;
                        }
                    } catch (e) { }
                }
                setLoadingNews(false);
            };

            useEffect(() => {
                if (currentView === 'news' && news.length === 0) fetchNews();
            }, [currentView]);

            const handleInstall = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setShowInstallBtn(false);
                setDeferredPrompt(null);
            };

            const togglePlay = async () => {
                if (!audioRef.current) return;
                if (!isPlaying) {
                    if(!audioRef.current.src) audioRef.current.src = RADIO_CONFIG.streamUrl;
                    try {
                        await audioRef.current.play();
                        setIsPlaying(true);
                    } catch (err) { }
                } else {
                    audioRef.current.pause();
                    setIsPlaying(false);
                }
            };

            const sendWp = (e) => {
                e.preventDefault();
                let msg = `📻 ¡Hola Voces Campesinas!\n\n*${formType === 'cancion' ? 'PEDIDO MUSICAL' : 'MENSAJE'}*\nNombre: ${requestData.nombre}\n${formType === 'cancion' ? 'Canción: '+requestData.cancion+'\nArtista: '+requestData.interprete+'\n' : ''}Mensaje: ${requestData.mensaje}`;
                window.open(`https://api.whatsapp.com/send?phone=${RADIO_CONFIG.whatsapp}&text=${encodeURIComponent(msg)}`, '_blank');
            };

            if (isSplash) {
                return (
                    <div className="fixed inset-0 bg-[#17202A] z-[100] flex flex-col items-center justify-center text-white p-8 overflow-hidden">
                        <div className="relative mb-10 w-48 h-48 animate-speaker">
                            <img src={RADIO_CONFIG.logoPath} className="w-full h-full object-contain" alt="Logo" />
                        </div>
                        <div className="text-center space-y-2">
                            <p className="text-[#F4D03F] text-[10px] font-black tracking-[0.5em]">Emisora Digital</p>
                            <h1 className="text-4xl font-black tracking-tighter italic leading-none">Voces Campesinas</h1>
                            <p className="text-white/40 text-xs font-bold tracking-[0.2em] italic leading-tight">"El Campo Nos Une"</p>
                        </div>
                        <div className="mt-12 w-32 h-0.5 bg-white/5 rounded-full overflow-hidden">
                            <div className="h-full bg-[#F4D03F] w-1/3 animate-loading"></div>
                        </div>
                        <div className="absolute bottom-10 text-center opacity-40 text-[11px] font-medium tracking-tight space-y-1.5 px-4">
                            <p>Un Proyecto Desarrollado</p>
                            <p>Con EI - Inteligencia Emocional </p>
                            <p className="font-black text-[#F4D03F] text-xs"><span>Poporo Design</span></p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen h-[100dvh] bg-[#17202A] text-white flex flex-col max-w-lg mx-auto shadow-2xl overflow-hidden relative">
                    <audio ref={audioRef} preload="auto" />
                    
                    {showInstallBtn && (
                        <button onClick={handleInstall} className="fixed bottom-20 right-4 z-[60] bg-[#F4D03F] text-[#17202A] px-4 py-3 rounded-full shadow-2xl flex items-center gap-2 font-black text-xs animate-install">
                            <Icon name="download-cloud" size={18} /> Instalar Voces-App
                        </button>
                    )}

                    <div className="fixed top-0 w-full max-w-lg z-50 pointer-events-none">
                        <div className="pointer-events-auto bg-[#0a0e13]/95 backdrop-blur-3xl border-b border-[#F4D03F]/30 p-3 shadow-2xl">
                            <div className="flex items-center justify-between gap-4 px-1">
                                <div className="flex items-center gap-3 flex-1 min-w-0">
                                    <div className={`w-3 h-3 rounded-full ${isPlaying ? 'bg-[#6cd14f] animate-pulse' : 'bg-white/10'}`}></div>
                                    <div className="min-w-0">
                                        <p className="text-[13px] font-bold text-white/95 truncate leading-tight">Estás Escuchando la Emisora Digital</p>
                                        <p className="text-[11px] font-black text-[#F4D03F] tracking-tighter opacity-90 leading-none mt-0.5">www.VocesCampesinas.co</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => {audioRef.current.pause(); audioRef.current.src=""; setIsPlaying(false);}} className="w-10 h-10 bg-white/5 text-white/30 rounded-lg flex items-center justify-center transition-colors"><Icon name="square" size={16} className="text-[#C0392B]" /></button>
                                    <button onClick={togglePlay} className="w-12 h-12 bg-[#F4D03F] text-black rounded-lg flex items-center justify-center shadow-xl active:scale-90 transition-all">
                                        {isPlaying ? <Icon name="pause" size={24} /> : <Icon name="play" size={24} className="ml-0.5" />}
                                    </button>
                                </div>
                            </div>
                            <div className="flex items-center gap-3 mt-3 px-1">
                                <Icon name={volume == 0 ? "volume-x" : "volume-2"} size={14} className="text-[#F4D03F]/30" />
                                <input type="range" min="0" max="1" step="0.01" value={volume} onChange={e => {setVolume(e.target.value); audioRef.current.volume = e.target.value;}} className="flex-1 h-1 bg-white/10 rounded-full appearance-none volume-slider cursor-pointer" />
                                <span className="text-[9px] font-bold text-white/20 w-7 text-right">{Math.round(volume*100)}%</span>
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 overflow-y-auto hide-scrollbar pt-[100px] pb-24 px-0">
                        {currentView === 'home' && (
                            <div key="home-view" className="animate-in fade-in duration-700 px-0">
                                <div className="live-card" style={{ backgroundImage: `url(${currentProgram?.image || 'general-musica.jpg'})` }}>
                                    <div className="absolute inset-0 z-10 p-4 flex flex-col justify-end">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="bg-red-600 text-white text-[8px] font-black px-1.5 py-0.5 rounded-full animate-pulse uppercase tracking-widest">En Vivo</span>
                                            <span className="text-white/60 text-[10px] font-bold tracking-tighter">Transmitiendo:</span>
                                        </div>
                                        <h2 className="text-xl font-black text-white truncate drop-shadow-lg">{currentProgram?.title || "La Música de la Tierrita..."}</h2>
                                        <p className="text-[#F4D03F] text-[10px] font-bold italic opacity-90 truncate drop-shadow-md">{currentProgram ? `con ${currentProgram.host}` : "Lo Mejor de Nuestro Campo..."}</p>
                                    </div>
                                </div>

                                <div className="next-band py-2.5 px-6 flex items-center gap-4 transition-all">
                                    <div className="p-2 bg-[#F4D03F]/10 rounded-xl shrink-0"><Icon name="chevron-right" className="text-[#F4D03F]" size={16} /></div>
                                    <div className="overflow-hidden flex-1">
                                        <div className="flex justify-between items-center gap-2 mb-0.5">
                                            <p className="text-[7px] font-black text-[#F4D03F]/70 tracking-[0.2em] uppercase">A Continuación:</p>
                                            <span className="text-[6px] font-black bg-[#F4D03F] text-[#17202A] px-1.5 py-0.5 rounded whitespace-nowrap">{nextDayInfo}</span>
                                        </div>
                                        <h3 className="font-black text-white text-sm truncate">{nextProgram ? nextProgram.title : "Música de la Tierrita"}</h3>
                                        <p className="text-[9px] text-white/40 italic truncate"><span className="text-[#F4D03F]/80 font-bold">{nextProgram?.start}</span> {nextProgram?.host ? `con ${nextProgram.host}` : "Franja Musical"}</p>
                                    </div>
                                </div>

                                <div className="px-6 py-6">
                                    <div className="text-center mb-5">
                                        <h2 className="text-lg font-black text-[#F4D03F] tracking-tighter">Interactua con Nosotros</h2>
                                        <p className="text-[8px] font-bold text-white/30 tracking-[0.2em] italic uppercase">Mensajes y Complacencias</p>
                                    </div>
                                    <div className="flex gap-2 mb-4 bg-black/40 p-1 rounded-xl border border-white/5">
                                        <button onClick={() => setFormType('mensaje')} className={`flex-1 py-2 rounded-lg text-[9px] font-bold transition-all ${formType === 'mensaje' ? 'bg-[#F4D03F] text-black shadow-lg' : 'text-white/40'}`}>Mensaje</button>
                                        <button onClick={() => setFormType('cancion')} className={`flex-1 py-2 rounded-lg text-[9px] font-bold transition-all ${formType === 'cancion' ? 'bg-[#F4D03F] text-black shadow-lg' : 'text-white/40'}`}>Canción</button>
                                    </div>
                                    <form onSubmit={sendWp} className="space-y-2.5">
                                        <input required placeholder="¿Cómo te llamas?" className="w-full glass-card p-3.5 rounded-xl text-xs outline-none focus:border-[#F4D03F]/50 text-white" onChange={e => setRequestData({...requestData, nombre: e.target.value})} />
                                        {formType === 'cancion' && (
                                            <div className="grid grid-cols-2 gap-2.5">
                                                <input required placeholder="Canción" className="w-full glass-card p-3.5 rounded-xl text-xs outline-none focus:border-[#F4D03F]/50 text-white" onChange={e => setRequestData({...requestData, cancion: e.target.value})} />
                                                <input required placeholder="Artista" className="w-full glass-card p-3.5 rounded-xl text-xs outline-none focus:border-[#F4D03F]/50 text-white" onChange={e => setRequestData({...requestData, interprete: e.target.value})} />
                                            </div>
                                        )}
                                        <textarea required placeholder="Escribe aquí..." rows="3" className="w-full glass-card p-3.5 rounded-xl text-xs outline-none focus:border-[#F4D03F]/50 resize-none text-white" onChange={e => setRequestData({...requestData, mensaje: e.target.value})}></textarea>
                                        <button className="w-full bg-[#F4D03F] text-black py-3.5 rounded-xl font-bold text-xs shadow-xl hover:bg-white active:scale-95 transition-all flex items-center justify-center gap-2 mb-4">
                                            <Icon name="message-circle" size={16} /> Enviar Mensaje a WhatsApp
                                        </button>
                                        <div className="pt-4 mt-2 border-t border-white/5 flex flex-col items-center gap-2.5 text-[10px] text-white/40 font-bold uppercase tracking-widest">
                                            <div className="flex items-center gap-2">
                                                <Icon name="mail" size={14} className="text-[#F4D03F]" />
                                                <span>E-Mail:</span>
                                                <a href={`mailto:${RADIO_CONFIG.email}`} className="text-white/80 lowercase font-normal">{RADIO_CONFIG.email}</a>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <Icon name="message-square" size={14} className="text-[#F4D03F]" />
                                                <span>WhatsApp:</span>
                                                <a href={`https://wa.me/${RADIO_CONFIG.whatsapp}`} className="text-white/80">{RADIO_CONFIG.displayWhatsapp}</a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {currentView === 'schedule' && (
                            <div key="schedule-view" className="px-6 pb-20 animate-in fade-in duration-500 overflow-y-auto">
                                <h2 className="text-xl font-bold text-center mb-6 pt-4 text-[#F4D03F]">Programación</h2>
                                {['propio', 'franja', 'entidad', 'reemision', 'pronto'].map(cat => {
                                    const progs = SCHEDULE.filter(p => p.category === cat);
                                    if(progs.length === 0) return null;
                                    const todayIdx = new Date().getDay();
                                    const labels = { propio: 'Programas Propios', franja: 'Franjas Musicales', entidad: 'RIT - Red de Información Territorial', reemision: 'Reemisiones', pronto: 'Próximamente' };
                                    const isPronto = cat === 'pronto';
                                    
                                    return (
                                        <div key={cat} className={`mb-8 ${isPronto ? 'opacity-60' : ''}`}>
                                            <div className="flex items-center gap-2 mb-3 opacity-50">
                                                <Icon name={isPronto ? "clock" : "calendar"} size={14}/>
                                                <span className="text-[10px] font-bold uppercase tracking-widest">{labels[cat]}</span>
                                            </div>
                                            <div className="space-y-3">
                                                {progs.map((p, i) => (
                                                    <div key={`prog-${cat}-${i}`} className={`glass-card p-4 ${isPronto ? 'border-dashed border-white/20 grayscale pointer-events-none' : ''}`}>
                                                        <div className="flex justify-between items-center mb-1">
                                                            <div className="flex items-center gap-3">
                                                                <span className="text-[#F4D03F] text-[11px] font-bold">{p.start} - {p.end}</span>
                                                                <div className="flex gap-1">
                                                                    {isPronto ? (
                                                                        <span className="text-[7px] bg-white/10 text-white/50 px-1.5 py-0.5 rounded font-black tracking-widest uppercase">Proximamennte</span>
                                                                    ) : (
                                                                        [0,1,2,3,4,5,6].map(dIdx => {
                                                                            if (!p.days.includes(dIdx)) return null;
                                                                            const isToday = dIdx === todayIdx;
                                                                            return (
                                                                                <span key={`day-${dIdx}`} className={`text-[7px] px-1.5 py-0.5 rounded font-black transition-all ${isToday ? 'bg-[#F4D03F] text-[#17202A] scale-110 shadow-lg' : 'bg-white/5 text-white/20'}`}>
                                                                                    {DAYS_SHORT[dIdx]}
                                                                                </span>
                                                                            );
                                                                        })
                                                                    )}
                                                                </div>
                                                            </div>
                                                            {currentProgram?.title === p.title && currentProgram?.start === p.start && <div className="bg-[#F4D03F] text-black px-2 py-0.5 rounded text-[8px] font-bold animate-pulse">Al Aire</div>}
                                                        </div>
                                                        <div className="font-bold text-base mt-1">{p.title}</div>
                                                        <div className="text-white/40 text-[10px] italic"><span>con {p.host}</span></div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {currentView === 'news' && (
                            <div key="news-view" className="px-4 pb-20 animate-in fade-in duration-500">
                                <h2 className="text-xl font-bold text-center mb-6 pt-4 text-[#F4D03F]">Conexión Territorial - Información y Noticias</h2>
                                {loadingNews ? (
                                    <div className="flex flex-col items-center justify-center py-24">
                                        <div className="w-10 h-10 border-4 border-white/5 border-t-[#F4D03F] rounded-full animate-spin mb-6"></div>
                                        <p className="text-[10px] font-black text-white/30 uppercase tracking-[0.3em] animate-pulse">Consultando el Blog...</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4 pb-10">
                                        {news.length > 0 ? news.map((item, idx) => (
                                            <div key={`news-${idx}`} onClick={() => window.open(item.link, '_blank')} className="glass-card flex gap-4 p-3 hover:bg-white/5 transition-all cursor-pointer border-white/5">
                                                <div className="shrink-0 w-[90px] h-[90px] rounded-lg overflow-hidden bg-black/40 border border-white/5">
                                                    <img src={item.thumbnail} alt="Img" className="w-full h-full object-cover" onError={(e) => e.target.src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=300"} />
                                                </div>
                                                <div className="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                                                    <div>
                                                        <span className="text-[8px] font-black bg-[#F4D03F] text-[#17202A] px-1.5 py-0.5 rounded mb-1.5 inline-block">{item.date}</span>
                                                        <h3 className="font-bold text-[13px] leading-tight mb-1 line-clamp-2">{item.title}</h3>
                                                    </div>
                                                    <p className="text-[10px] text-white/40 italic line-clamp-2">{item.summary}</p>
                                                </div>
                                            </div>
                                        )) : (
                                            <div className="text-center py-20 px-6">
                                                <Icon name="newspaper" size={40} className="mx-auto text-white/10 mb-4" />
                                                <p className="text-sm font-bold text-white/40 mb-6 uppercase tracking-widest font-black">No se pudo conectar con el Blog</p>
                                                <button onClick={fetchNews} className="bg-white/5 border border-white/10 px-6 py-3 rounded-xl text-xs font-black uppercase hover:bg-white/10 transition-all">Reintentar Carga</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {currentView === 'social' && (
                            <div key="social-view" className="px-6 animate-in fade-in text-center max-w-md mx-auto">
                                <h2 className="text-xl font-bold mb-1 pt-4 text-[#F4D03F]">Suigenos y Dale Me Gusta</h2>
                                <p className="text-white/40 text-[12px] font-bold tracking-widest mb-10 italic">#ElCampoNosUne</p>
                                <div className="grid grid-cols-1 gap-4 pb-20">
                                    {[
                                        { n: 'Sitio Web', i: 'globe', u: RADIO_CONFIG.webUrl },
                                        { n: 'WhatsApp', i: 'message-square', u: `https://wa.me/${RADIO_CONFIG.whatsapp}` },
                                        { n: 'YouTube', i: 'youtube', u: RADIO_CONFIG.youtubeUrl },
                                        { n: 'Facebook', i: 'facebook', u: "https://www.facebook.com/VocesCampesinas.co" },
                                        { n: 'Instagram', i: 'instagram', u: "https://www.instagram.com/vocescampesinas.co/" },
                                        { n: 'TikTok', i: 'tiktok', u: "https://www.tiktok.com/@vocescampesinas.co" },
                                        { n: 'E-mail', i: 'mail', u: `mailto:${RADIO_CONFIG.email}` }
                                    ].map(s => (
                                        <button key={s.n} onClick={() => window.open(s.u, '_blank')} className="glass-card flex items-center justify-between p-5 hover:bg-white/5 transition-all border-white/5">
                                            <div className="flex items-center gap-4">
                                                <Icon name={s.i} size={22} className="text-[#F4D03F]" />
                                                <span className="text-sm font-semibold">{s.n}</span>
                                            </div>
                                            <Icon name="chevron-right" size={14} className="opacity-20" />
                                        </button>
                                    ))}
                                     <div className="pt-4 mt-2 border-t border-white/5 flex flex-col items-center gap-2.5 text-[10px] text-white/40 font-bold uppercase tracking-widest">
                                            <div className="flex items-center gap-2">
                                                <Icon name="mail" size={14} className="text-[#F4D03F]" />
                                                <span>E-Mail:</span>
                                                <a href={`mailto:${RADIO_CONFIG.email}`} className="text-white/80 lowercase font-normal">{RADIO_CONFIG.email}</a>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <Icon name="message-square" size={14} className="text-[#F4D03F]" />
                                                <span>WhatsApp:</span>
                                                <a href={`https://wa.me/${RADIO_CONFIG.whatsapp}`} className="text-white/80">{RADIO_CONFIG.displayWhatsapp}</a>
                                            </div>
                                </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-0 w-full max-w-lg z-50 pointer-events-none">
                        <nav className="pointer-events-auto bg-[#0a0e13]/95 backdrop-blur-xl border-t border-white/5 flex justify-around items-center h-14 shadow-2xl">
                            {[ 
                                { id: 'home', l: 'Radio', i: 'radio' }, 
                                { id: 'schedule', l: 'Horarios', i: 'calendar' }, 
                                { id: 'news', l: 'Noticias', i: 'newspaper' }, 
                                { id: 'social', l: 'Redes', i: 'share-2' } 
                            ].map(t => (
                                <button key={t.id} onClick={() => setCurrentView(t.id)} className={`flex flex-col items-center gap-0.5 transition-all px-6 h-full justify-center ${currentView === t.id ? 'active-tab' : 'text-white/30'}`}>
                                    <Icon name={t.i} size={20} />
                                    <span className="text-[9px] font-bold tracking-tight">{t.l}</span>
                                </button>
                            ))}
                        </nav>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
