<!DOCTYPE html>
<html lang="es">
<head>
    <!-- ========================================================
         SECCIÓN: METADATOS Y TÍTULO
         ======================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emisora Digital Voces Campesinas</title>
    
    <!-- ========================================================
         SECCIÓN: FAVICON Y ICONOS DE DISPOSITIVOS
         ======================================================== -->
    <link rel="icon" type="image/png" href="LogoVC.png">
    <link rel="shortcut icon" href="LogoVC.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="android-icon-192x192.png">
    
    <!-- ========================================================
         SECCIÓN: CONFIGURACIÓN PWA (Aplicación Instalable)
         ======================================================== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17202A">
    
    <!-- ========================================================
         SECCIÓN: LIBRERÍAS EXTERNAS
         ======================================================== -->
    <!-- Tailwind CSS: Para el diseño rápido con clases -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel: Para la lógica de la aplicación -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons: Iconografía general -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ========================================================
           SECCIÓN: ESTILOS PERSONALIZADOS (CSS)
           ======================================================== */
        :root {
            --carbon: #17202A;   /* Fondo Principal */
            --trigo: #F4D03F;    /* Color de Acento */
            --rojo-alerta: #C0392B; /* Color para Stop/Alertas */
        }

        /* Estilo para el manejador del volumen */
        .volume-slider::-webkit-slider-thumb { 
            appearance: none; 
            width: 16px; 
            height: 16px; 
            background: var(--trigo); 
            border-radius: 50%; 
            cursor: pointer; 
            border: 2px solid white; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5); 
        }
        
        body { 
            background: var(--carbon); 
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden; 
        }

        /* Animación "Bass" para el logo cuando suena la música */
        @keyframes speaker-beat {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(244, 208, 63, 0)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(244, 208, 63, 0.4)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(244, 208, 63, 0)); }
        }
        .animate-speaker { animation: speaker-beat 2s infinite ease-in-out; }

        /* Animación suave para textos de carga */
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse-slow 3s infinite ease-in-out; }

        /* Utilidad para ocultar barras de scroll estéticamente */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilo común para tarjetas con efecto cristal (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
        }

        /* Estilo para la pestaña activa en la navegación inferior */
        .active-tab {
            color: var(--trigo) !important;
            background: rgba(244, 208, 63, 0.1);
        }
    </style>
</head>
<body>
    <!-- Contenedor principal donde React inyectará la app -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // ========================================================
        // COMPONENTE: ICON (Gestión de Iconos Lucide y SVGs)
        // ========================================================
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name, size, className]);

            // SVGs manuales para redes sociales (Lucide no los incluye por defecto)
            const brandIcons = {
                'facebook': <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>,
                'instagram': <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>,
                'youtube': <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path>,
                'tiktok': <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
            };

            if (brandIcons[name]) {
                return (
                    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        {brandIcons[name]}
                        {name === 'instagram' && <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>}
                        {name === 'instagram' && <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>}
                        {name === 'youtube' && <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>}
                    </svg>
                );
            }
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // ========================================================
        // CONFIGURACIÓN: DATOS GENERALES DE LA RADIO
        // ========================================================
        const RADIO_CONFIG = {
            name: "Voces Campesinas",
            streamUrl: "https://a1.asurahosting.com/listen/voces_campesinas/radio.mp3",
            logoPath: "LogoVC.png", 
            whatsapp: "573224626138",
            youtubeUrl: "https://www.youtube.com/@VocesCampesinasCo",
            facebookUrl: "https://www.facebook.com/VocesCampesinas.co",
            instagramUrl: "https://www.instagram.com/vocescampesinas.co/",
            tiktokUrl: "https://www.tiktok.com/@vocescampesinas.co",
            webUrl: "https://www.vocescampesinas.co"
        };

        // ========================================================
        // BASE DE DATOS: PROGRAMACIÓN SEMANAL
        // ========================================================
        const SCHEDULE = [
            { start: "00:00", end: "04:59", title: "La Licuadora", host: "Franja Crossover", org: "Voces Campesinas", category: "franja", days: [1,2,3,4,5,6,0] },
            { start: "05:00", end: "05:59", title: "Alborada Campesina", host: "Música Colombiana", org: "Producción Local", category: "franja", days: [1,2,3,4,5,6,0] },
            { start: "19:30", end: "20:30", title: "Palabras del Territorio", host: "Walter Sosa", org: "Voces Campesinas", category: "propio", days: [2, 6] },
            { start: "19:30", end: "22:59", title: "Lo Mejor de Región Activa", host: "Jotta Rincón", org: "CorpoActúa", category: "reemision", days: [1,2,3,4,5] },
            { start: "20:00", end: "20:59", title: "Cosecha de Amor", host: "Dj Rosado", org: "Voces Campesinas", category: "franja", days: [1,2,3,4,5,6,0] },
            { start: "06:30", end: "06:59", title: "Campesinos en Acción", host: "Equipo Comunicaciones", org: "ANUC La Palma", category: "entidad", days: [6, 1] },
            { start: "07:30", end: "10:59", title: "Magazín Región Activa", host: "Jotta Ricón", org: "CorpoActúa", category: "entidad", days: [6, 3] }
        ];

        // ========================================================
        // COMPONENTE PRINCIPAL: APP
        // ========================================================
        const App = () => {
            // -- Estados de la aplicación --
            const [isSplash, setIsSplash] = useState(true);        // Control de pantalla de carga
            const [isPlaying, setIsPlaying] = useState(false);     // Control de reproducción
            const [volume, setVolume] = useState(0.8);             // Control de volumen
            const [currentView, setCurrentView] = useState('home');// Navegación entre vistas
            const [currentProgram, setCurrentProgram] = useState(null); // Programa actual al aire
            const [nextProgram, setNextProgram] = useState(null);       // Siguiente programa
            const [formType, setFormType] = useState('mensaje');   // Tipo de formulario WhatsApp
            const [requestData, setRequestData] = useState({ nombre: '', cancion: '', interprete: '', mensaje: '' });
            const [showInstallBtn, setShowInstallBtn] = useState(false); // Botón de instalación PWA
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const audioRef = useRef(null);

            // -- Efectos Iniciales --
            useEffect(() => {
                // Timer para quitar el Splash Screen
                const timer = setTimeout(() => setIsSplash(false), 3500);

                // Registro de Service Worker para PWA
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(() => {});
                }

                // Captura del evento de instalación
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                });

                // Lógica para determinar qué programa está sonando según la hora
                const update = () => {
                    const now = new Date();
                    const cur = now.getHours() * 60 + now.getMinutes();
                    const day = now.getDay();
                    const timeToMin = (t) => { const [h,m] = t.split(':').map(Number); return h*60+m; };
                    
                    const prog = SCHEDULE.find(p => cur >= timeToMin(p.start) && cur < timeToMin(p.end) && (p.days ? p.days.includes(day) : true));
                    let up = SCHEDULE.filter(p => p.days ? p.days.includes(day) : true).sort((a,b) => timeToMin(a.start) - timeToMin(b.start)).find(p => timeToMin(p.start) > cur);
                    if(!up) up = SCHEDULE.filter(p => p.days ? p.days.includes((day+1)%7) : true).sort((a,b) => timeToMin(a.start) - timeToMin(b.start))[0];
                    
                    setCurrentProgram(prog || null);
                    setNextProgram(up || null);
                };
                update();
                const interval = setInterval(update, 30000); // Actualiza cada 30 seg
                return () => { clearInterval(interval); clearTimeout(timer); };
            }, []);

            // -- Manejador de Reproducción --
            const togglePlay = () => {
                if (!isPlaying) {
                    if(!audioRef.current.src) audioRef.current.src = RADIO_CONFIG.streamUrl;
                    audioRef.current.play();
                } else {
                    audioRef.current.pause();
                }
                setIsPlaying(!isPlaying);
            };

            // -- Manejador de WhatsApp --
            const sendWp = (e) => {
                e.preventDefault();
                let text = "📻 👋 ¡Hola Voces Campesinas!\n\n";
                if(formType === 'cancion') {
                    text += "🎵 *PEDIDO MUSICAL*\n👤 *Nombre:* " + requestData.nombre + "\n💿 *Canción:* " + requestData.cancion + "\n🎤 *Artista:* " + requestData.interprete + "\n";
                } else {
                    text += "💬 *MENSAJE*\n👤 *De:* " + requestData.nombre + "\n";
                }
                text += "\n✍️ *Mensaje:* " + requestData.mensaje;
                window.open(`https://api.whatsapp.com/send?phone=${RADIO_CONFIG.whatsapp}&text=${encodeURIComponent(text)}`, '_blank');
            };

            // ========================================================
            // VISTA: PANTALLA DE CARGA (SPLASH)
            // ========================================================
            if (isSplash) {
                return (
                    <div className="fixed inset-0 bg-[#17202A] z-[100] flex flex-col items-center justify-center text-center p-8">
                        <div className="relative mb-8 w-64 h-64">
                            <div className="absolute inset-0 bg-[#F4D03F]/10 rounded-full animate-ping"></div>
                            <img src="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?auto=format&fit=crop&q=80&w=600" className="w-full h-full object-cover rounded-full border-4 border-[#F4D03F]/20 shadow-2xl opacity-80" alt="Splash Radio" />
                        </div>
                        <h1 className="text-3xl font-bold text-[#F4D03F] tracking-tighter mb-2 italic uppercase">Voces Campesinas</h1>
                        <p className="text-white/40 text-[10px] font-bold uppercase tracking-[0.4em] animate-pulse-slow">La Emisora Digital del Campo Colombiano...</p>
                        <div className="mt-12 w-48 h-1 bg-white/5 rounded-full overflow-hidden">
                            <div className="h-full bg-[#F4D03F] w-1/2 animate-[loading_2s_infinite]"></div>
                        </div>
                        <style>{`@keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }`}</style>
                    </div>
                );
            }

            // ========================================================
            // ESTRUCTURA PRINCIPAL DE LA APP
            // ========================================================
            return (
                <div className="min-h-screen bg-[#17202A] text-white flex flex-col max-w-lg mx-auto shadow-2xl">
                    {/* Elemento de Audio Invisible */}
                    <audio ref={audioRef} preload="auto" />
                    
                    {/* Cabecera (Header) */}
                    <header className="h-16 flex items-center justify-center border-b border-white/5 bg-[#17202A]/80 backdrop-blur-md sticky top-0 z-50">
                        <span className="font-bold text-lg tracking-tighter text-white/90 uppercase">www.<span className="text-[#F4D03F]">Voces Campesinas</span>.co</span>
                    </header>

                    {/* Contenido Dinámico según la Vista Seleccionada */}
                    <main className="flex-1 overflow-y-auto hide-scrollbar">
                        
                        {/* --- VISTA: RADIO (HOME) --- */}
                        {currentView === 'home' && (
                            <div className="flex flex-col items-center justify-center min-h-[60vh] text-center px-6 pt-4 animate-in fade-in duration-700">
                                <div className="relative mb-8">
                                    <img src={RADIO_CONFIG.logoPath} className={`w-32 h-32 object-contain pointer-events-none ${isPlaying ? 'animate-speaker' : 'opacity-90'}`} onError={e => e.target.src="https://images.unsplash.com/photo-1516733968668-dbdce39c46ef?auto=format&fit=crop&q=80&w=600"} />
                                    {!isPlaying && (
                                        <div onClick={togglePlay} className="absolute inset-0 flex items-center justify-center cursor-pointer">
                                            <div className="bg-[#F4D03F] text-black w-11 h-11 rounded-full flex items-center justify-center shadow-2xl animate-pulse"><Icon name="play" size={22} className="ml-1" /></div>
                                        </div>
                                    )}
                                </div>
                                <div className="mb-8">
                                    <p className="text-[10px] font-bold text-[#F4D03F] uppercase tracking-[0.5em] mb-1 opacity-80">Emisora Digital</p>
                                    <h1 className="text-3xl font-bold leading-tight mb-1">Voces <span className="text-[#F4D03F]">Campesinas</span></h1>
                                    <p className="text-xs font-medium text-white/30 italic tracking-widest">"El campo nos une"</p>
                                </div>
                                {showInstallBtn && (
                                   <button onClick={() => { deferredPrompt.prompt(); setDeferredPrompt(null); }} className="mb-8 glass-card px-6 py-2.5 rounded-xl flex items-center gap-3 text-[9px] font-bold uppercase tracking-widest text-[#F4D03F]"><Icon name="download" size={14} />Instalar App</button>
                                )}
                                <div className="w-full max-w-xs glass-card p-4 text-left flex items-start gap-4 shadow-xl border-[#F4D03F]/10">
                                    <div className="p-2.5 bg-[#F4D03F]/10 rounded-xl"><Icon name="chevron-right" className="text-[#F4D03F]" size={18} /></div>
                                    <div className="overflow-hidden">
                                        <p className="text-[9px] font-bold text-[#F4D03F] uppercase tracking-widest mb-0.5 opacity-60">Siguiente programa</p>
                                        <h3 className="font-bold text-white text-sm truncate">{nextProgram ? nextProgram.title : "Música Variada"}</h3>
                                        <p className="text-[11px] text-white/40 italic capitalize">{nextProgram ? `${nextProgram.start} con ${nextProgram.host}` : "La Mejor Música De La Tierrita"}</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- VISTA: PROGRAMACIÓN (SCHEDULE) --- */}
                        {currentView === 'schedule' && (
                            <div className="px-6 pb-64 animate-in fade-in duration-500 overflow-y-auto max-h-screen hide-scrollbar">
                                <h2 className="text-xl font-bold text-center mb-6 pt-4 text-[#F4D03F]">Programación</h2>
                                {['propio', 'franja', 'entidad', 'reemision'].map(cat => {
                                    const progs = SCHEDULE.filter(p => p.category === cat);
                                    if(progs.length === 0) return null;
                                    const labels = { propio: 'Producción Propia', franja: 'Franjas Musicales', entidad: 'Red De Información Territorial', reemision: 'Reemisiones' };
                                    const todayNum = new Date().getDay();

                                    return (
                                        <div key={cat} className="mb-8">
                                            <div className="flex items-center gap-2 mb-3 opacity-50"><Icon name="calendar" size={14}/><span className="text-[10px] font-bold uppercase tracking-widest">{labels[cat]}</span></div>
                                            <div className="space-y-3">
                                                {progs.map((p, i) => (
                                                    <div key={i} className="glass-card p-4">
                                                        <div className="flex items-center justify-between mb-2">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-[#F4D03F] text-[11px] font-bold">{p.start} - {p.end}</span>
                                                                <div className="flex gap-1">
                                                                    {p.days?.map(d => {
                                                                        const isCurrentDay = (d === todayNum);
                                                                        return (
                                                                            <span key={d} className={`text-[7px] font-black px-1.5 py-0.5 rounded border transition-all ${isCurrentDay ? 'bg-[#F4D03F] text-[#17202A] border-[#F4D03F] shadow-lg' : 'bg-white/10 text-white/80 border-white/10'}`}>
                                                                                {['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d]}
                                                                            </span>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                            {currentProgram?.title === p.title && (
                                                                <div className="bg-[#F4D03F] text-black px-2 py-0.5 rounded text-[8px] font-bold animate-pulse uppercase">Al Aire</div>
                                                            )}
                                                        </div>
                                                        <div className="font-bold text-base text-white/95 leading-tight mb-1">{p.title}</div>
                                                        <div className="text-white/40 text-[10px] italic flex items-center gap-1.5 flex-wrap">
                                                            <span> {p.host}</span>
                                                            {p.org && <span className="text-[#F4D03F]/60 font-bold uppercase not-italic">• {p.org}</span>}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* --- VISTA: REDES SOCIALES (SOCIAL) --- */}
                        {currentView === 'social' && (
                            <div className="px-6 pb-64 animate-in fade-in max-w-md mx-auto">
                                <h2 className="text-xl font-bold text-center mb-1 pt-4 text-[#F4D03F]">Conéctate</h2>
                                <p className="text-white/40 text-[10px] font-bold tracking-widest text-center mb-10 italic">#ElCampoNosUne</p>
                                <div className="grid grid-cols-1 gap-4">
                                    {[
                                        { n: 'Sitio web', i: 'globe', u: RADIO_CONFIG.webUrl, c: 'text-emerald-400' },
                                        { n: 'YouTube', i: 'youtube', u: RADIO_CONFIG.youtubeUrl, c: 'text-red-500' },
                                        { n: 'Facebook', i: 'facebook', u: RADIO_CONFIG.facebookUrl, c: 'text-blue-500' },
                                        { n: 'Instagram', i: 'instagram', u: RADIO_CONFIG.instagramUrl, c: 'text-[#F4D03F]' },
                                        { n: 'TikTok', i: 'tiktok', u: RADIO_CONFIG.tiktokUrl, c: 'text-white' }
                                    ].map(s => (
                                        <button key={s.n} onClick={() => window.open(s.u, '_blank')} className="glass-card flex items-center justify-between p-5 hover:bg-white/5 transition-all">
                                            <div className="flex items-center gap-4"><Icon name={s.i} size={22} className={s.c} /><span className="text-sm font-semibold">{s.n}</span></div>
                                            <Icon name="chevron-right" size={14} className="opacity-20" />
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* --- VISTA: PEDIDOS WHATSAPP (WHATSAPP) --- */}
                        {currentView === 'whatsapp' && (
                            <div className="px-6 pb-64 animate-in slide-in-from-bottom-6 max-w-md mx-auto">
                                <h2 className="text-xl font-bold text-center mb-1 pt-4 text-[#F4D03F]">Escríbenos</h2>
                                <p className="text-white/40 text-[10px] font-bold tracking-widest text-center mb-6 italic">Pedidos y saludos</p>
                                <div className="flex gap-2 mb-6 bg-black/40 p-1 rounded-xl border border-white/5">
                                    <button onClick={() => setFormType('mensaje')} className={`flex-1 py-2.5 rounded-lg text-[10px] font-bold uppercase transition-all ${formType === 'mensaje' ? 'bg-[#F4D03F] text-black shadow-lg' : 'text-white/30'}`}>Mensaje</button>
                                    <button onClick={() => setFormType('cancion')} className={`flex-1 py-2.5 rounded-lg text-[10px] font-bold uppercase transition-all ${formType === 'cancion' ? 'bg-[#F4D03F] text-black shadow-lg' : 'text-white/30'}`}>Canción</button>
                                </div>
                                <form onSubmit={sendWp} className="space-y-4">
                                    <input required placeholder="¿Cómo te llamas?" className="w-full glass-card p-4 rounded-xl text-sm outline-none focus:border-[#F4D03F]/50 text-white" onChange={e => setRequestData({...requestData, nombre: e.target.value})} />
                                    {formType === 'cancion' && (
                                        <div className="grid grid-cols-2 gap-3">
                                            <input required placeholder="Canción" className="w-full glass-card p-4 rounded-xl text-sm outline-none focus:border-[#F4D03F]/50 text-white" onChange={e => setRequestData({...requestData, cancion: e.target.value})} />
                                            <input required placeholder="Artista" className="w-full glass-card p-4 rounded-xl text-sm outline-none focus:border-[#F4D03F]/50 text-white" onChange={e => setRequestData({...requestData, interprete: e.target.value})} />
                                        </div>
                                    )}
                                    <textarea required placeholder="Escribe tu mensaje aquí..." rows="3" className="w-full glass-card p-4 rounded-xl text-sm outline-none focus:border-[#F4D03F]/50 resize-none text-white" onChange={e => setRequestData({...requestData, mensaje: e.target.value})}></textarea>
                                    <button className="w-full bg-[#F4D03F] text-black py-4 rounded-xl font-bold uppercase text-sm shadow-xl hover:bg-white active:scale-95 transition-all">Enviar</button>
                                </form>
                            </div>
                        )}
                    </main>

                    {/* ========================================================
                        SECCIÓN: BARRA DE REPRODUCCIÓN (PLAYER)
                        ======================================================== */}
                    <div className="fixed bottom-0 w-full max-w-lg z-50 px-4 pb-6 pt-10 pointer-events-none">
                        <div className="pointer-events-auto bg-[#1a2533]/95 backdrop-blur-3xl rounded-xl border border-white/10 p-4 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                            <div className="flex items-center justify-between gap-4 mb-4">
                                <div className="flex-1 min-w-0">
                                    <div className="flex items-center gap-1.5 mb-1">
                                        <div className={`w-1.5 h-1.5 rounded-full ${isPlaying ? 'bg-emerald-500 animate-pulse' : 'bg-white/20'}`}></div>
                                        <span className="text-[9px] font-bold text-[#F4D03F] uppercase tracking-widest">{isPlaying ? 'Transmitiendo' : 'Radio detenida'}</span>
                                    </div>
                                    <div className="text-sm font-bold truncate text-white/95">{currentProgram?.title || "La Mejor Música de la Tierrita"}</div>
                                </div>
                                <div className="flex items-center gap-2">
                                    {/* Botón Stop (Cierra conexión) */}
                                    <button onClick={() => {audioRef.current.pause(); audioRef.current.src=""; setIsPlaying(false);}} className="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center transition-colors shadow-inner"><Icon name="square" size={16} className="text-[#C0392B]" /></button>
                                    {/* Botón Play/Pause */}
                                    <button onClick={togglePlay} className="w-12 h-12 bg-[#F4D03F] text-black rounded-xl flex items-center justify-center shadow-lg active:scale-90 transition-all">{isPlaying ? <Icon name="pause" size={24} /> : <Icon name="play" size={24} className="ml-1" />}</button>
                                </div>
                            </div>
                            {/* Control de Volumen */}
                            <div className="flex items-center gap-3 px-1">
                                <Icon name={volume == 0 ? "volume-x" : "volume-2"} size={14} className="text-[#F4D03F]/50" />
                                <input type="range" min="0" max="1" step="0.01" value={volume} onChange={e => {setVolume(e.target.value); audioRef.current.volume = e.target.value;}} className="flex-1 h-1 bg-white/10 rounded-full appearance-none volume-slider" />
                                <span className="text-[10px] font-bold text-white/20 w-8">{Math.round(volume*100)}%</span>
                            </div>
                        </div>

                        {/* Barra de Navegación Inferior (Tabs) */}
                        <nav className="pointer-events-auto bg-[#17202A] border border-white/5 mt-3 px-1.5 py-2 flex justify-around rounded-xl shadow-xl">
                            {[
                                { id: 'home', l: 'Radio', i: 'radio' },
                                { id: 'schedule', l: 'Horarios', i: 'calendar' },
                                { id: 'social', l: 'Redes', i: 'share-2' },
                                { id: 'whatsapp', l: 'Pedir', i: 'message-circle' }
                            ].map(t => (
                                <button key={t.id} onClick={() => setCurrentView(t.id)} className={`flex flex-col items-center gap-1 transition-all px-3 py-1.5 rounded-lg ${currentView === t.id ? 'active-tab' : 'text-white/30'}`}>
                                    <Icon name={t.i} size={18} />
                                    <span className="text-[9px] font-bold uppercase tracking-tight">{t.l}</span>
                                </button>
                            ))}
                        </nav>
                    </div>
                </div>
            );
        };

        // Renderizado inicial de la aplicación
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
