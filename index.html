<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emisora Digital Voces Campesinas</title>
    
    <link rel="icon" type="image/png" href="LogoVC.png">
    <link rel="apple-touch-icon" href="android-icon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17202A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Librerías con versiones específicas para estabilidad -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        :root {
            --carbon: #17202A;
            --trigo: #F4D03F;
            --rojo-alerta: #C0392B;
        }

        .volume-slider::-webkit-slider-thumb { 
            appearance: none; 
            width: 18px; 
            height: 18px; 
            background: var(--trigo); 
            border-radius: 50%; 
            cursor: pointer; 
            border: 2px solid white; 
        }
        
        body { 
            background: var(--carbon); 
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            overscroll-behavior-y: none;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100%;
        }

        @keyframes speaker-beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .animate-speaker { animation: speaker-beat 2s infinite ease-in-out; }

        @keyframes loading-bar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
        .animate-loading { animation: loading-bar 2s infinite linear; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
        }

        .active-tab {
            color: var(--trigo) !important;
            background: rgba(244, 208, 63, 0.1);
        }

        .live-card {
            position: relative;
            width: 100%;
            height: 120px;
            background-size: cover;
            background-position: center;
            background-color: #000;
        }
        .live-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 14, 19, 0.95) 5%, rgba(10, 14, 19, 0.2) 100%);
        }

        .next-band {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(244, 208, 63, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                'radio': <path d="M4.9 19.1a1 1 0 0 0 1.4 0l1.6-1.6a1 1 0 0 0 0-1.4 7 7 0 1 1 8.2 0 1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0 11 11 0 1 0-14.2 0ZM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>,
                'calendar': <g><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></g>,
                'newspaper': <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>,
                'share-2': <g><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></g>,
                'play': <polygon points="5 3 19 12 5 21 5 3"></polygon>,
                'pause': <g><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></g>,
                'square': <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>,
                'volume-2': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></g>,
                'volume-x': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></g>,
                'download-cloud': <g><path d="M4 14.89c0-4 3.12-7.39 7.06-7.39 1.1 0 2.12.25 3.03.7a6 6 0 0 1 8.91 5.3c0 .54-.08 1.05-.22 1.54"></path><path d="M12 12v9"></path><path d="m15 18-3 3-3-3"></path></g>,
                'facebook': <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>,
                'instagram': <g><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></g>,
                'youtube': <g><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></g>,
                'tiktok': <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>,
                'globe': <g><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></g>,
                'chevron-right': <polyline points="9 18 15 12 9 6"></polyline>,
                'message-circle': <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"></path>,
                'mail': <g><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path><rect x="2" y="5" width="20" height="14" rx="2"></rect></g>,
                'message-square': <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>,
                'clock': <g><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></g>
            };

            return (
                <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" strokeDasharray="4" />}
                </svg>
            );
        };

        const RADIO_CONFIG = {
            name: "Voces Campesinas",
            streamUrl: "https://a1.asurahosting.com/listen/voces_campesinas/radio.mp3",
            logoPath: "LogoVC.png", 
            whatsapp: "573224626138",
            displayWhatsapp: "322.462.6138",
            youtubeUrl: "https://www.youtube.com/@VocesCampesinasCo",
            webUrl: "https://www.vocescampesinas.co",
            email: "emisora@vocescampesinas.co",
            bloggerFeed: "https://vocescampesinas.blogspot.com/feeds/posts/default?alt=json&max-results=12"
        };

        const SCHEDULE = [
            { start: "00:00", end: "04:59", title: "La Licuadora", host: "Franja Crossover", org: "Voces Campesinas", category: "franja", days: [1,2,3,4,5,6,0], image: "la-licuadora.jpg" },
            { start: "05:00", end: "06:29", title: "Alborada Campesina", host: "Música Colombiana", org: "Producción Local", category: "franja", days: [1,2,3,4,5,6,0], image: "alborada.jpg" },
            { start: "06:15", end: "06:27", title: "Voces del Cosmos", host: "Horoscopo Semanal", org: "Voces Campesinas", category: "propio", days: [6, 1], image: "campesinos-accion.jpg" },
            { start: "06:30", end: "06:59", title: "Campesinos en Acción", host: "José Antonio González", org: "ANUC La Palma", category: "entidad", days: [6, 2], image: "campesinos-accion.jpg" },
            { start: "09:00", end: "09:59", title: "Perreo Campesino", host: "Música Carranguera", org: "Voces Campesinas", category: "franja", days: [1,2,4,5,0], image: "perreo-campesino.jpg" },
            { start: "07:30", end: "10:59", title: "Magazín Región Activa", host: "Jotta Ricón", org: "CorpoActúa", category: "entidad", days: [6, 3], image: "region-activa.jpg" },
            { start: "13:00", end: "13:59", title: "Perreo Campesino", host: "Música Carranguera", org: "Voces Campesinas", category: "franja", days: [1,2,3,4,5,6,0], image: "perreo-tarde.jpg" },
            { start: "19:30", end: "20:30", title: "Renacer Andino", host: "Ramón Olivares", org: "Grupo Cultural de Antofagasta, Chile", category: "entidad", days: [0, 3], image: "renacer-andino.jpg" },
            { start: "19:30", end: "22:59", title: "Lo Mejor de Región Activa", host: "Lo mejor del 2025 y 2026", org: "CorpoActúa", category: "reemision", days: [5], image: "resumen-region.jpg" },
            { start: "--:--", end: "--:--", title: "La Parcela Política", host: "Gran Lanzamiento", org: "Voces Campesinas", category: "pronto", days: [] },
            { start: "--:--", end: "--:--", title: "Sembrando Esperanza", host: "Gran Lanzamiento", org: "Voces Campesinas", category: "pronto", days: [] },
            { start: "--:--", end: "--:--", title: "Palabras del Territorio", host: "Gran Lanzamiento", org: "Voces Campesinas", category: "pronto", days: [] }
        ];

        const DAYS_SHORT = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        const DAYS_FULL = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

        const App = () => {
            const [isSplash, setIsSplash] = useState(true);
            const [isPlaying, setIsPlaying] = useState(false);
            const [volume, setVolume] = useState(0.8);
            const [currentView, setCurrentView] = useState('home');
            const [currentProgram, setCurrentProgram] = useState(null);
            const [nextProgram, setNextProgram] = useState(null);
            const [nextDayInfo, setNextDayInfo] = useState("");
            const [news, setNews] = useState([]);
            const [loadingNews, setLoadingNews] = useState(false);
            const [formType, setFormType] = useState('mensaje'); 
            const [requestData, setRequestData] = useState({ nombre: '', cancion: '', interprete: '', mensaje: '' });
            const [showInstallBtn, setShowInstallBtn] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const audioRef = useRef(null);

            useEffect(() => {
                const splashTimer = setTimeout(() => setIsSplash(false), 4500);

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW error:', e));
                }
                
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                });

                const updateTimeLogic = () => {
                    const now = new Date();
                    const cur = now.getHours() * 60 + now.getMinutes();
                    const day = now.getDay();
                    const timeToMin = (t) => { 
                        if(!t || t === "--:--") return 0;
                        const [h,m] = t.split(':').map(Number); 
                        return h*60+m; 
                    };
                    
                    const prog = SCHEDULE.find(p => p.category !== 'pronto' && cur >= timeToMin(p.start) && cur < timeToMin(p.end) && (p.days ? p.days.includes(day) : true));
                    setCurrentProgram(prog || null);

                    let upcoming = null;
                    let label = "Hoy";
                    upcoming = SCHEDULE.filter(p => p.category !== 'pronto' && p.days.includes(day)).filter(p => timeToMin(p.start) > cur).sort((a,b) => timeToMin(a.start) - timeToMin(b.start))[0];

                    if (!upcoming) {
                        for (let i = 1; i <= 7; i++) {
                            const checkDay = (day + i) % 7;
                            const found = SCHEDULE.filter(p => p.category !== 'pronto' && p.days.includes(checkDay)).sort((a,b) => timeToMin(a.start) - timeToMin(b.start))[0];
                            if (found) {
                                upcoming = found;
                                label = i === 1 ? "Mañana" : DAYS_FULL[checkDay];
                                break;
                            }
                        }
                    }
                    setNextProgram(upcoming || null);
                    setNextDayInfo(label);
                };

                updateTimeLogic();
                const interval = setInterval(updateTimeLogic, 30000);
                return () => { clearInterval(interval); clearTimeout(splashTimer); };
            }, []);

            const fetchNews = async () => {
                setLoadingNews(true);
                const target = RADIO_CONFIG.bloggerFeed;
                try {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`);
                    const raw = await res.json();
                    const data = JSON.parse(raw.contents);
                    
                    const entries = data.feed?.entry || [];
                    const formatted = entries.map(e => ({
                        title: e.title.$t,
                        link: e.link.find(l => l.rel === 'alternate')?.href || RADIO_CONFIG.webUrl,
                        date: new Date(e.published.$t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }),
                        thumbnail: e.media$thumbnail ? e.media$thumbnail.url.replace('/s72-c/', '/s640/') : "https://via.placeholder.com/400x300?text=Voces+Campesinas",
                        summary: e.summary?.$t ? e.summary.$t.replace(/<[^>]*>?/gm, '').substring(0, 110) + '...' : 'Toca para leer más.'
                    }));
                    setNews(formatted);
                } catch (err) {
                    console.error("Error cargando noticias");
                } finally {
                    setLoadingNews(false);
                }
            };

            useEffect(() => {
                if (currentView === 'news' && news.length === 0) fetchNews();
            }, [currentView]);

            const togglePlay = async () => {
                if (!audioRef.current) return;
                if (!isPlaying) {
                    audioRef.current.src = RADIO_CONFIG.streamUrl;
                    try {
                        await audioRef.current.play();
                        setIsPlaying(true);
                    } catch (err) { console.warn("Error al reproducir"); }
                } else {
                    audioRef.current.pause();
                    audioRef.current.src = "";
                    setIsPlaying(false);
                }
            };

            const sendWp = (e) => {
                e.preventDefault();
                let msg = `📻 ¡Hola Voces Campesinas!\n\n*${formType === 'cancion' ? 'PEDIDO MUSICAL' : 'MENSAJE'}*\nNombre: ${requestData.nombre}\n${formType === 'cancion' ? 'Canción: '+requestData.cancion+'\nArtista: '+requestData.interprete+'\n' : ''}Mensaje: ${requestData.mensaje}`;
                window.open(`https://api.whatsapp.com/send?phone=${RADIO_CONFIG.whatsapp}&text=${encodeURIComponent(msg)}`, '_blank');
            };

            if (isSplash) {
                return (
                    <div className="fixed inset-0 bg-[#17202A] z-[100] flex flex-col items-center justify-center text-white p-8">
                        <div className="relative mb-10 w-48 h-48 animate-speaker">
                            <img src={RADIO_CONFIG.logoPath} className="w-full h-full object-contain" alt="Logo" onError={(e) => e.target.style.display='none'} />
                        </div>
                        <div className="text-center space-y-2">
                            <p className="text-[#F4D03F] text-[10px] font-black tracking-[0.5em]">Emisora Digital</p>
                            <h1 className="text-4xl font-black italic">Voces Campesinas</h1>
                            <p className="text-white/40 text-xs font-bold italic">"El Campo Nos Une"</p>
                        </div>
                        <div className="mt-12 w-32 h-0.5 bg-white/5 overflow-hidden">
                            <div className="h-full bg-[#F4D03F] w-1/3 animate-loading"></div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col max-w-lg mx-auto bg-[#17202A] relative overflow-hidden">
                    <audio ref={audioRef} preload="none" />
                    
                    {/* Header Fijo */}
                    <header className="fixed top-0 w-full max-w-lg z-50 bg-[#0a0e13]/95 backdrop-blur-xl border-b border-[#F4D03F]/30 p-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className={`w-3 h-3 rounded-full ${isPlaying ? 'bg-green-500 animate-pulse' : 'bg-white/10'}`}></div>
                                <div>
                                    <p className="text-xs font-bold opacity-80">Estás escuchando</p>
                                    <p className="text-sm font-black text-[#F4D03F]">VocesCampesinas.co</p>
                                </div>
                            </div>
                            <button onClick={togglePlay} className="w-12 h-12 bg-[#F4D03F] text-black rounded-lg flex items-center justify-center shadow-lg active:scale-90 transition-all">
                                {isPlaying ? <Icon name="pause" size={24} /> : <Icon name="play" size={24} className="ml-1" />}
                            </button>
                        </div>
                        <div className="flex items-center gap-3 mt-3">
                            <input type="range" min="0" max="1" step="0.01" value={volume} onChange={e => {setVolume(e.target.value); audioRef.current.volume = e.target.value;}} className="flex-1 h-1 bg-white/10 rounded-full appearance-none volume-slider" />
                            <span className="text-[10px] font-bold opacity-30">{Math.round(volume*100)}%</span>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto pt-32 pb-20 px-0 hide-scrollbar">
                        {currentView === 'home' && (
                            <div className="animate-in fade-in">
                                <div className="live-card" style={{ backgroundImage: `url(${currentProgram?.image || 'https://via.placeholder.com/600x400?text=Voces+Campesinas'})` }}>
                                    <div className="absolute bottom-4 left-4 z-20">
                                        <span className="bg-red-600 text-[8px] font-black px-2 py-1 rounded-full animate-pulse uppercase">Al Aire</span>
                                        <h2 className="text-xl font-black mt-1">{currentProgram?.title || "La Música de la Tierrita"}</h2>
                                        <p className="text-[#F4D03F] text-xs italic">{currentProgram?.org || "Sintonía Rural"}</p>
                                    </div>
                                </div>

                                <div className="next-band p-4 flex items-center gap-4">
                                    <Icon name="chevron-right" className="text-[#F4D03F]" size={20} />
                                    <div>
                                        <p className="text-[8px] font-black text-[#F4D03F]/70 tracking-widest uppercase">A continuación ({nextDayInfo}):</p>
                                        <h3 className="font-bold text-sm">{nextProgram?.title || "Programación Musical"}</h3>
                                    </div>
                                </div>

                                <div className="p-6">
                                    <h2 className="text-center font-black text-[#F4D03F] mb-4">INTERACTÚA CON NOSOTROS</h2>
                                    <div className="flex gap-2 mb-4 bg-black/20 p-1 rounded-xl">
                                        <button onClick={() => setFormType('mensaje')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${formType === 'mensaje' ? 'bg-[#F4D03F] text-black' : 'opacity-40'}`}>Mensaje</button>
                                        <button onClick={() => setFormType('cancion')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${formType === 'cancion' ? 'bg-[#F4D03F] text-black' : 'opacity-40'}`}>Canción</button>
                                    </div>
                                    <form onSubmit={sendWp} className="space-y-3">
                                        <input required placeholder="Tu nombre" className="w-full glass-card p-4 text-sm bg-transparent outline-none" onChange={e => setRequestData({...requestData, nombre: e.target.value})} />
                                        {formType === 'cancion' && (
                                            <div className="grid grid-cols-2 gap-2">
                                                <input required placeholder="Canción" className="glass-card p-4 text-sm bg-transparent outline-none" onChange={e => setRequestData({...requestData, cancion: e.target.value})} />
                                                <input required placeholder="Artista" className="glass-card p-4 text-sm bg-transparent outline-none" onChange={e => setRequestData({...requestData, interprete: e.target.value})} />
                                            </div>
                                        )}
                                        <textarea required placeholder="Mensaje..." rows="3" className="w-full glass-card p-4 text-sm bg-transparent outline-none resize-none" onChange={e => setRequestData({...requestData, mensaje: e.target.value})}></textarea>
                                        <button className="w-full bg-[#F4D03F] text-black py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                                            <Icon name="message-circle" size={18} /> Enviar al WhatsApp
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {currentView === 'schedule' && (
                            <div className="p-6 animate-in slide-in-from-bottom-4">
                                <h2 className="text-xl font-black text-[#F4D03F] mb-6 text-center">PROGRAMACIÓN</h2>
                                {['propio', 'franja', 'entidad', 'reemision', 'pronto'].map(cat => {
                                    const progs = SCHEDULE.filter(p => p.category === cat);
                                    if(progs.length === 0) return null;
                                    const labels = { propio: 'Producción Propia', franja: 'Franjas Musicales', entidad: 'Red Territorial', reemision: 'Reemisiones', pronto: 'Próximamente' };
                                    return (
                                        <div key={cat} className="mb-8">
                                            <p className="text-[10px] font-black opacity-30 mb-3 tracking-widest uppercase">{labels[cat]}</p>
                                            <div className="space-y-3">
                                                {progs.map((p, i) => (
                                                    <div key={i} className="glass-card p-4 border-white/5">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <span className="text-[#F4D03F] font-bold text-xs">{p.start} - {p.end}</span>
                                                            <div className="flex gap-1">
                                                                {p.days.map(d => (
                                                                    <span key={d} className={`text-[8px] px-1.5 py-0.5 rounded ${new Date().getDay() === d ? 'bg-[#F4D03F] text-black' : 'bg-white/5'}`}>{DAYS_SHORT[d]}</span>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <h3 className="font-bold">{p.title}</h3>
                                                        <p className="text-xs opacity-40">con {p.host}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {currentView === 'news' && (
                            <div className="p-4 animate-in fade-in">
                                <h2 className="text-xl font-black text-[#F4D03F] mb-6 text-center">NOTICIAS</h2>
                                {loadingNews ? (
                                    <div className="flex flex-col items-center py-20"><div className="w-8 h-8 border-2 border-[#F4D03F] border-t-transparent rounded-full animate-spin mb-4"></div></div>
                                ) : (
                                    <div className="space-y-4">
                                        {news.map((item, idx) => (
                                            <div key={idx} onClick={() => window.open(item.link, '_blank')} className="glass-card p-3 flex gap-4 items-center">
                                                <img src={item.thumbnail} className="w-20 h-20 object-cover rounded-lg" />
                                                <div className="flex-1">
                                                    <span className="text-[9px] bg-[#F4D03F] text-black px-2 py-0.5 rounded font-bold">{item.date}</span>
                                                    <h3 className="font-bold text-sm leading-tight mt-1 line-clamp-2">{item.title}</h3>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {currentView === 'social' && (
                            <div className="p-6 text-center space-y-4">
                                <h2 className="text-xl font-black text-[#F4D03F] mb-10">REDES SOCIALES</h2>
                                {[
                                    { n: 'Sitio Web', i: 'globe', u: RADIO_CONFIG.webUrl },
                                    { n: 'YouTube', i: 'youtube', u: RADIO_CONFIG.youtubeUrl },
                                    { n: 'Facebook', i: 'facebook', u: "https://www.facebook.com/VocesCampesinas.co" },
                                    { n: 'WhatsApp', i: 'message-square', u: `https://wa.me/${RADIO_CONFIG.whatsapp}` }
                                ].map(s => (
                                    <button key={s.n} onClick={() => window.open(s.u, '_blank')} className="w-full glass-card p-5 flex items-center justify-between">
                                        <div className="flex items-center gap-4">
                                            <Icon name={s.i} size={24} className="text-[#F4D03F]" />
                                            <span className="font-bold">{s.n}</span>
                                        </div>
                                        <Icon name="chevron-right" size={16} className="opacity-20" />
                                    </button>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Navbar Inferior */}
                    <nav className="fixed bottom-0 w-full max-w-lg bg-[#0a0e13]/95 backdrop-blur-xl border-t border-white/5 flex justify-around items-center h-16 z-50">
                        {[ 
                            { id: 'home', l: 'Radio', i: 'radio' }, 
                            { id: 'schedule', l: 'Horarios', i: 'calendar' }, 
                            { id: 'news', l: 'Noticias', i: 'newspaper' }, 
                            { id: 'social', l: 'Redes', i: 'share-2' } 
                        ].map(t => (
                            <button key={t.id} onClick={() => setCurrentView(t.id)} className={`flex flex-col items-center gap-1 transition-all ${currentView === t.id ? 'text-[#F4D03F]' : 'opacity-30'}`}>
                                <Icon name={t.i} size={20} />
                                <span className="text-[10px] font-bold uppercase tracking-tighter">{t.l}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
